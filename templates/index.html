<!DOCTYPE html>
<html>
<head>
    <title>Starsolutions Bot</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .header img {
            width: 40px;
            margin-right: 10px;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .msg {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }

        .user {
            background: #007bff;
            color: white;
            margin-left: auto;
        }

        .bot {
            background: #f1f1f1;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #eee;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            margin-left: 10px;
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <img src="/static/logo.JPG" />
        <b>Starsolutions Bot</b>
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">
        <input id="q" placeholder="Ask something..." />
        <button onclick="ask()">➤</button>
    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
